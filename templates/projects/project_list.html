{% extends "base.html" %}
{% block title %}Projetos{% endblock %}

{% block content %}

<h2 class="mb-4">Projetos disponíveis</h2>

<div class="row">
{% for project in projects %}
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5>{{ project.title }}</h5>
        <p>{{ project.description|truncatewords:15 }}</p>

        <a href="{% url 'project_detail' project.id %}" class="btn btn-dark">
          Ver projeto
        </a>
      </div>
    </div>
  </div>
{% empty %}
<p>Nenhum projeto cadastrado.</p>
{% endfor %}
</div>

{% endblock %}
