{% extends "base.html" %}

{% block title %}Candidatar{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">

    <div class="card shadow-sm">
      <div class="card-body">

        <h3>Candidatar ao projeto</h3>
        <p class="text-muted">{{ project.title }}</p>

        <hr>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}

          <button type="submit" class="btn btn-success">
            Enviar candidatura
          </button>

          <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">
            Cancelar
          </a>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
